{% extends "layouts/layout.html" %}

{% block content %}

<!-- ════════════════════════════════════════════
     Page
════════════════════════════════════════════ -->
<div class="horario-page">

  <h1 class="horario-title">Horarios</h1>

  <!-- Top bar -->
  <div class="horario-topbar">
    <div class="horario-topbar-left">
      <span class="horario-topbar-label">Horarios</span>
      <select class="horario-select" id="aula-filter">
        <!-- populated by JS -->
      </select>
    </div>
    <button class="btn-agregar" id="btn-agregar">+ Agregar Horario</button>
  </div>

  <!-- Grid sections (one per aula) -->
  <div id="schedule-container">
    <!-- populated by JS -->
  </div>

</div>

<!-- ════════════════════════════════════════════
     Modal — Agregar / Editar clase
════════════════════════════════════════════ -->
<div class="modal-overlay" id="modal-agregar" role="dialog" aria-modal="true" aria-labelledby="modal-title-text">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title" id="modal-title-text">Agregar Clase</span>
      <button class="modal-close" id="modal-close" aria-label="Cerrar">✕</button>
    </div>

    <!-- Materia -->
    <div class="form-group">
      <label class="form-label" for="form-nombre">Materia</label>
      <input class="form-input" id="form-nombre" type="text" placeholder="Ej. Matemáticas">
    </div>

    <!-- Grupo + Docente -->
    <div class="form-row">
      <div class="form-group">
        <label class="form-label" for="form-grupo">Grupo</label>
        <input class="form-input" id="form-grupo" type="text" placeholder="Ej. 10-A">
      </div>
      <div class="form-group">
        <label class="form-label" for="form-docente">Docente</label>
        <input class="form-input" id="form-docente" type="text" placeholder="Nombre">
      </div>
    </div>

    <!-- Aula -->
    <div class="form-group">
      <label class="form-label" for="form-aula">Aula</label>
      <select class="form-select form-input" id="form-aula">
        <!-- populated by JS -->
      </select>
    </div>

    <!-- Día + Horario -->
    <div class="form-row">
      <div class="form-group">
        <label class="form-label" for="form-dia">Día</label>
        <select class="form-select form-input" id="form-dia">
          <!-- populated by JS -->
        </select>
      </div>
      <div class="form-group">
        <label class="form-label" for="form-slot">Horario</label>
        <select class="form-select form-input" id="form-slot">
          <!-- populated by JS -->
        </select>
      </div>
    </div>

    <!-- Color -->
    <div class="form-group">
      <label class="form-label">Color</label>
      <div class="color-picker" id="color-picker">
        <!-- populated by JS -->
      </div>
    </div>

    <div class="form-actions">
      <button class="btn-cancel" id="btn-cancel">Cancelar</button>
      <button class="btn-save"   id="btn-save">Guardar</button>
    </div>
  </div>
</div>


{% endblock %}
