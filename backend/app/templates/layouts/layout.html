<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>ClassTrack</title>
    <link rel="stylesheet" href="/static/css/layout.css">
    <link rel="stylesheet" href="/static/css/home.css">
    <link rel="stylesheet" href="/static/css/gestion.css">
    <link rel="stylesheet" href="/static/css/configuracion.css">
    <link rel="stylesheet" href="/static/css/horarios.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>
    <div class="container">
        <aside class="sidebar" id="sidebar">
           <div class="sidebar-header">
                <button id="toggleSidebar" class="toggle-btn">
                    <i class="fa-solid fa-bars"></i>
                </button>
                <div class="logo">
                    <span>ClassTrack</span>
                </div>

                <div class="theme-toggle-wrapper">
                    <label class="toggle-switch" title="Modo oscuro">
                        <input type="checkbox" id="darkModeToggle">
                        <span class="toggle-track">
                            <span class="toggle-thumb"></span>
                        </span>
                    </label>
                    <i class="fa-solid fa-sun theme-icon" id="themeIcon"></i>
                </div>
            </div>
            <ul class="menu">
                <li class="{{ 'active' if seccion == 'home' }}">
                    <a href="/admin/home">
                        <i class="fa-solid fa-house"></i>
                        <span>Home</span>
                    </a>
                </li>
                <li class="{{ 'active' if seccion == 'horarios' }}">
                    <a href="/admin/horarios">
                        <i class="fa-regular fa-clock"></i>
                        <span>Horarios</span>
                    </a>
                </li>
                <li class="{{ 'active' if seccion == 'sheets' }}">
                    <a href="/admin/sheets">
                        <i class="fa-solid fa-table"></i>
                        <span>Google Sheets</span>
                    </a>
                </li>
                <li class="{{ 'active' if seccion == 'camaras' }}">
                    <a href="/admin/camaras">
                        <i class="fa-solid fa-camera"></i>
                        <span>Cámaras</span>
                    </a>
                </li>
                <li class="{{ 'active' if seccion == 'gestion' }}">
                    <a href="/admin/gestion">
                        <i class="fa-solid fa-users"></i>
                        <span>Gestión</span>
                    </a>
                </li>
                <li class="{{ 'active' if seccion == 'configuracion' }}">
                    <a href="/admin/configuracion">
                        <i class="fa-solid fa-gear"></i>
                        <span>Configuración</span>
                    </a>
                </li>
                
            </ul>

            <div class="logout" id="logoutBtn">
                <i class="fa-solid fa-right-from-bracket"></i>
                <span>Salir</span>
            </div>
        </aside>

        <main class="content">
            {% block content %}
            {% endblock %}
        </main>
    </div>
    <script src="/static/js/auth.js"></script>
    <script src="/static/js/siderbar.js"></script>
    <script src="/static/js/gestion.js"></script>
    <script src="/static/js/configuracion.js"></script>
    <script src="/static/js/horarios.js"></script>
</body>
</html>
