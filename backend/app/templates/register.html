<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ClassTrack - Registro</title>
<link rel="stylesheet" href="/static/css/auth.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

<div class="container">

    <div class="login-card">

        <div class="icon-circle">
            <i class="fa-solid fa-desktop"></i>
        </div>

        <h1>ClassTrack</h1>
        <h2>Crear Cuenta</h2>

        <form>

            <label>Nombre Completo</label>
            <input type="text" placeholder="Juan Pérez">

            <label>Correo Electrónico</label>
            <input type="email" placeholder="tu@email.com">

            <label>Contraseña</label>
            <div class="password-container">
                <input type="password" id="password" placeholder="Mínimo 6 caracteres">
                <i class="fa-solid fa-eye togglePassword"></i>
            </div>

            <label>Confirmar Contraseña</label>
            <div class="password-container">
                <input type="password" id="confirmPassword" placeholder="Repite tu contraseña">
                <i class="fa-solid fa-eye togglePassword"></i>
            </div>

            <button type="submit">Registrarse</button>

        </form>

        <p class="register">
            ¿Ya tienes una cuenta?
            <a href="/login">Inicia Sesión</a>
        </p>

    </div>

</div>

<script src="/static/js/auth.js"></script>
</body>
</html>
